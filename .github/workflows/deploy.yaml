name: Deploy to Environment
description: Reusable workflow to deploy services to k8s clusters

permissions:
  id-token: write
  contents: write
  pull-requests: read

env:
  TAG: ${{ inputs.environment }}-${{ github.run_number }}
  RUN_NUMBER: ${{ github.run_number }}

on:
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: string
        default: dev

      service-name:
        description: The name of the service to deploy
        required: true
        type: string

      registry:
        description: The ECR registry URL to push images to
        required: true
        type: string
        
      path-to-k8s-image-tag:
        description: The path to the kustomization.yaml file containing the image tag
        required: true
        type: string

      cf-template:
        description: The CloudFormation template file path
        required: false
        type: string
        default: aws-resources.yaml

      branch-override:
        description: The branch that will be updated (usually main)
        required: false
        type: string
        default: main

      eks-cluster-stack-name:
        description: The name of the EKS cluster stack for CloudFormation
        required: false
        type: string
        default: bisnow-non-prod-eks

      aws-account:
        description: AWS account identifier
        required: false
        type: string
        default: bisnow

      flux-target-branch:
        description: The branch that flux watches (usually flux-main)
        required: false
        type: string
        default: flux-main

      source-image-tag:
        description: Source image tag to use for beta/prod environments (e.g., dev-123)
        required: false
        type: string
        default: ''

      dst-registry:
        description: Destination registry for cross-account image tagging (optional)
        required: false
        type: string
        default: ''

      dst-aws-account:
        description: Destination AWS account for cross-account image tagging (optional)
        required: false
        type: string
        default: ''
      
      disable-cloudformation:
        description: Disable CloudFormation deployment
        required: false
        type: boolean
        default: false

jobs:
  check-for-k8s-changes:
    name: Check for K8s Manifest Changes
    runs-on: ubuntu-latest
    outputs:
      k8s_changed: ${{ steps.filter.outputs.k8s_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for k8s changes
        id: filter
        run: |
          K8S_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^\.?k8s/' || true)
          if [[ -n "$K8S_CHANGED" ]]; then
            echo "K8s changes found:"
            echo "$K8S_CHANGED"
            echo "k8s_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No K8s changes found"
            echo "k8s_changed=false" >> $GITHUB_OUTPUT
          fi

  tag-existing-image:
    name: Tag Existing Image for Beta/Prod
    runs-on: ubuntu-latest
    if: inputs.environment == 'beta' || inputs.environment == 'prod'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set source image tag
        id: set_source_tag
        run: |
          if [[ -n "${{ inputs.source-image-tag }}" ]]; then
            echo "Using provided source image tag: ${{ inputs.source-image-tag }}"
            echo "source_tag=${{ inputs.source-image-tag }}" >> $GITHUB_OUTPUT
          else
            # Default to latest dev image
            echo "No source image tag provided, using latest dev image"
            echo "source_tag=dev-latest" >> $GITHUB_OUTPUT
          fi
      
      - name: Tag Image Using Composite Action
        uses: bisnow/github-actions-tag-image@main
        with:
          registry: ${{ inputs.registry }}/${{ inputs.service-name }}
          aws-account: ${{ inputs.aws-account }}
          sha: ${{ steps.set_source_tag.outputs.source_tag }}
          tag: ${{ env.TAG }}
          dst-registry: ${{ inputs.dst-registry }}
          dst-aws-account: ${{ inputs.dst-aws-account }}

  check-for-cf-changes:
    name: Check for CloudFormation/Infra Changes
    runs-on: ubuntu-latest
    if: ${{ !inputs.disable-cloudformation }}
    outputs:
      cf_changed: ${{ steps.detect.outputs.cf_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect CloudFormation template changes
        id: detect
        run: |
          # Only deploy CloudFormation in dev environment
          if [[ "${{ inputs.environment }}" != "dev" ]]; then
            echo "Environment is ${{ inputs.environment }} - CloudFormation deployment skipped (only dev deploys infrastructure)"
            echo "cf_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          CF_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E "^${{ inputs.cf-template }}$" || true)
          if [[ -n "$CF_CHANGED" ]]; then
            echo "CloudFormation template changes found:"
            echo "$CF_CHANGED"
            echo "cf_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No CloudFormation template changes found"
            echo "cf_changed=false" >> $GITHUB_OUTPUT
          fi

  deploy-cloudformation:
    name: Deploy to AWS CloudFormation
    runs-on: ubuntu-latest
    needs: check-for-cf-changes
    if: needs.check-for-cf-changes.outputs.cf_changed == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Verify CloudFormation template exists
        run: |
          if [[ ! -f "${{ inputs.cf-template }}" ]]; then
            echo "Error: CloudFormation template not found at ${{ inputs.cf-template }}"
            exit 1
          fi
      
      - name: Log into AWS
        uses: bisnow/github-actions-assume-role-for-environment@main
        with:
          aws-account: ${{ inputs.aws-account }}
      
      - name: Deploy to AWS CloudFormation
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ inputs.service-name }}-${{ inputs.environment }}
          template: ./${{ inputs.cf-template }}
          parameter-overrides: "Environment=${{ inputs.environment }},EksClusterStackName=${{ inputs.eks-cluster-stack-name }}"
          tags: '[{"Key": "cdci","Value":"github"}]'
          capabilities: CAPABILITY_NAMED_IAM
          no-fail-on-empty-changeset: "1"

  update-flux-branch:
    name: Force-update flux branch to match deployment branch
    runs-on: ubuntu-latest
    needs: [check-for-k8s-changes, tag-existing-image, deploy-cloudformation]
    if: always()
    steps:
      - name: Decide if we should update flux branch
        id: should_run
        run: |
          echo "k8s_changed=${{ needs.check-for-k8s-changes.outputs.k8s_changed }}"
          echo "tag_existing_image_result=${{ needs.tag-existing-image.result }}"
          
          # Update flux if:
          # 1. K8s manifests changed
          # 2. Image was tagged for beta/prod successfully
          if { 
            [ "${{ needs.check-for-k8s-changes.outputs.k8s_changed }}" = "true" ]
          } || {
            [ "${{ needs.tag-existing-image.result }}" = "success" ]
          }; then
            echo "Flux branch update needed"
            echo "run_flux=true" >> $GITHUB_ENV
          else
            echo "No flux branch update needed"
            echo "run_flux=false" >> $GITHUB_ENV
          fi
      
      - name: Checkout Repository
        if: env.run_flux == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Ensure local branch is up to date with remote
        if: env.run_flux == 'true'
        run: |
          git fetch origin
          git checkout ${{ inputs.branch-override }}
          git reset --hard origin/${{ inputs.branch-override }}
      
      - name: Force-update ${{ inputs.flux-target-branch }} to match ${{ inputs.branch-override }}
        if: env.run_flux == 'true'
        run: |
          echo "Force-pushing ${{ inputs.branch-override }} to ${{ inputs.flux-target-branch }}"
          git push origin ${{ inputs.branch-override }}:${{ inputs.flux-target-branch }} --force